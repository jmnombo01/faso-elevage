[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd backend && npm ci --legacy-peer-deps || npm install --legacy-peer-deps"]

[phases.build]
cmds = ["cd backend && ./node_modules/.bin/prisma generate && npm run build"]

[start]
cmd = "cd backend && ./node_modules/.bin/prisma migrate deploy && node dist/server.js"
